name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.scope.outputs.tests }}
      package: ${{ steps.scope.outputs.package }}
      container: ${{ steps.scope.outputs.container }}
      smoke: ${{ steps.scope.outputs.smoke }}
      bootstrap: ${{ steps.scope.outputs.bootstrap }}
      peer: ${{ steps.scope.outputs.peer }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          package-manager-cache: false
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          node scripts/ci-scope.mjs --self-test

          if [ "$EVENT_NAME" = "pull_request" ] \
            && git cat-file -e "$PR_BASE_SHA^{commit}" 2>/dev/null \
            && git cat-file -e "$PR_HEAD_SHA^{commit}" 2>/dev/null; then
            git diff --no-renames --name-only -z "$PR_BASE_SHA...$PR_HEAD_SHA"
          elif [ "$EVENT_NAME" = "push" ] \
            && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            git diff --no-renames --name-only -z "$BEFORE_SHA" "$GITHUB_SHA"
          else
            printf '%s\0' "__unknown__"
          fi | node scripts/ci-scope.mjs >> "$GITHUB_OUTPUT"

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          package-manager-cache: false
      - run: npm ci
      - run: npm run format:check

  validate:
    needs: scope
    if: ${{ needs.scope.outputs.tests == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          package-manager-cache: false
      - run: npm ci
      - run: npm run check

  windows-bootstrap:
    name: Windows bootstrap acceptance
    needs: scope
    if: ${{ needs.scope.outputs.bootstrap == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Check disposable runner prerequisites
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # Node.js is explicitly provisioned from package.json engine metadata.
          node --version
          npm --version

          # Fail rather than describing a pre-populated runner as a fresh bootstrap.
          foreach ($name in @('pi', 'pi.cmd', 'herdr', 'herdr.exe')) {
            if (Get-Command $name -ErrorAction SilentlyContinue) {
              throw "Expected a fresh runner, but $name is already available."
            }
          }
          Write-Output 'Pi and Herdr are absent before bootstrap.'
      - name: Check native Windows installer syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./install.ps1).Path,
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }
      - name: Install and verify Windows stack
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Verify-InstalledStack {
            node --version
            npm --version
            $pi = Get-Command pi.cmd -ErrorAction SilentlyContinue
            if (-not $pi) { $pi = Get-Command pi -ErrorAction Stop }
            $herdr = Get-Command herdr.exe -ErrorAction SilentlyContinue
            if (-not $herdr) { $herdr = Get-Command herdr -ErrorAction Stop }
            & $pi.Source --version
            if ($LASTEXITCODE -ne 0) { throw 'Pi version check failed.' }
            & $herdr.Source --version
            if ($LASTEXITCODE -ne 0) { throw 'Herdr version check failed.' }

            $packages = & $pi.Source list --no-approve
            if ($LASTEXITCODE -ne 0) { throw 'Could not inspect installed Pi packages.' }
            if (-not ($packages | Where-Object { "$($_)".Trim() -match '^npm:pi-herdsman(?:\s+\(filtered\))?$' })) {
              throw 'The installed Herdsman package is not sourced from npm:pi-herdsman.'
            }

            $integrationStatus = & $herdr.Source integration status
            if ($LASTEXITCODE -ne 0) { throw 'Herdr Pi integration status check failed.' }
            if (-not (($integrationStatus -join "`n") -match '(?m)^pi: current \(v\d+\)(?: .+)?$')) {
              throw "Herdr Pi integration is not enabled/current:`n$($integrationStatus -join "`n")"
            }
          }

          .\install.ps1
          Verify-InstalledStack
          .\install.ps1
          Verify-InstalledStack

  package:
    needs: scope
    if: ${{ needs.scope.outputs.package == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - run: npm run package:audit

  container:
    needs: scope
    if: ${{ needs.scope.outputs.container != 'none' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - if: ${{ needs.scope.outputs.container == 'smoke' }}
        run: scripts/container-smoke.sh
      - run: docker compose config
      - run: docker compose -f compose.yaml -f compose.tailscale.yaml config

  smoke:
    name: Simulated smoke
    needs: scope
    if: ${{ needs.scope.outputs.smoke == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          package-manager-cache: false
      - run: npm ci
      - name: Verify pinned Pi
        shell: bash
        run: |
          expected=$(node -p "require('./package.json').devDependencies['@earendil-works/pi-coding-agent']")
          test "$(node_modules/.bin/pi --version)" = "$expected"
      - name: Install verified Herdr
        shell: bash
        run: |
          set -euo pipefail

          version=$(node -p \
            "require('./package.json').piHerdsman.runtime.herdr.version")
          sha=$(node -p \
            "require('./package.json').piHerdsman.runtime.herdr.sha256['linux-x86_64']")

          curl -fsSL --retry 3 --connect-timeout 10 --max-time 120 \
            "https://github.com/herdrdev/herdr/releases/download/v${version}/herdr-linux-x86_64" \
            -o "$RUNNER_TEMP/herdr"

          printf '%s  %s\n' "$sha" "$RUNNER_TEMP/herdr" |
            sha256sum -c -

          chmod 0755 "$RUNNER_TEMP/herdr"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Simulated runtime acceptance
        id: acceptance
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          set -euo pipefail

          for scenario in \
            core \
            continuation \
            chief-tree \
            supervisor-agent \
            terminal-failure \
            agent-terminal-failure \
            manager-handoff \
            agent-crash-recovery
          do
            echo "::group::Simulated smoke: $scenario"
            npm run smoke -- "$scenario" --simulated
            echo "::endgroup::"
          done
      - name: Upload sanitized failure evidence
        if: ${{ failure() && steps.acceptance.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: simulated-smoke-failure
          path: ${{ runner.temp }}/pi-herdsman-smoke-evidence-*/result.json
          if-no-files-found: warn
          retention-days: 3

  peer-federation:
    name: Peer federation
    needs: scope
    if: ${{ needs.scope.outputs.peer == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - phase: Manager
            smoke_phase: ""
            diagnostics: "0"
          - phase: Ordinary Lead
            smoke_phase: delivery
            diagnostics: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          package-manager-cache: false
      - name: Verify checkout SHA
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - run: npm ci
      - name: Federation acceptance
        env:
          PEER_SMOKE_PHASE: ${{ matrix.smoke_phase }}
          PEER_SMOKE_DIAGNOSTICS: ${{ matrix.diagnostics }}
        run: node scripts/peer-federation-smoke.mjs

  ci:
    name: CI
    if: ${{ always() }}
    needs:
      [
        scope,
        format,
        validate,
        package,
        container,
        smoke,
        windows-bootstrap,
        peer-federation,
      ]
    runs-on: ubuntu-latest
    env:
      SCOPE_RESULT: ${{ needs.scope.result }}
      FORMAT_RESULT: ${{ needs.format.result }}
      VALIDATE_RESULT: ${{ needs.validate.result }}
      TESTS_REQUIRED: ${{ needs.scope.outputs.tests }}
      PACKAGE_RESULT: ${{ needs.package.result }}
      PACKAGE_REQUIRED: ${{ needs.scope.outputs.package }}
      CONTAINER_RESULT: ${{ needs.container.result }}
      CONTAINER_REQUIRED: ${{ needs.scope.outputs.container != 'none' }}
      SMOKE_REQUIRED: ${{ needs.scope.outputs.smoke }}
      SMOKE_RESULT: ${{ needs.smoke.result }}
      BOOTSTRAP_REQUIRED: ${{ needs.scope.outputs.bootstrap }}
      WINDOWS_BOOTSTRAP_RESULT: ${{ needs.windows-bootstrap.result }}
      PEER_REQUIRED: ${{ needs.scope.outputs.peer }}
      PEER_RESULT: ${{ needs.peer-federation.result }}
    steps:
      - run: |
          set -euo pipefail

          [ "$SCOPE_RESULT" = "success" ]
          [ "$FORMAT_RESULT" = "success" ]

          required_result() {
            case "$1:$2" in
              true:success|false:skipped) ;;
              *)
                echo "Invalid $3 outcome: required=$1 result=$2" >&2
                exit 1
                ;;
            esac
          }

          required_result "$TESTS_REQUIRED" "$VALIDATE_RESULT" "Node tests"
          required_result "$PACKAGE_REQUIRED" "$PACKAGE_RESULT" "Package"
          required_result "$CONTAINER_REQUIRED" "$CONTAINER_RESULT" "Container"
          required_result "$SMOKE_REQUIRED" "$SMOKE_RESULT" "Simulated smoke"
          required_result "$BOOTSTRAP_REQUIRED" "$WINDOWS_BOOTSTRAP_RESULT" "Windows bootstrap"
          required_result "$PEER_REQUIRED" "$PEER_RESULT" "Peer federation"
