name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.scope.outputs.tests }}
      package: ${{ steps.scope.outputs.package }}
      container: ${{ steps.scope.outputs.container }}
      smoke: ${{ steps.scope.outputs.smoke }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          package-manager-cache: false
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          node scripts/ci-scope.mjs --self-test

          if [ "$EVENT_NAME" = "pull_request" ] \
            && git cat-file -e "$PR_BASE_SHA^{commit}" 2>/dev/null \
            && git cat-file -e "$PR_HEAD_SHA^{commit}" 2>/dev/null; then
            git diff --no-renames --name-only -z "$PR_BASE_SHA...$PR_HEAD_SHA"
          elif [ "$EVENT_NAME" = "push" ] \
            && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            git diff --no-renames --name-only -z "$BEFORE_SHA" "$GITHUB_SHA"
          else
            printf '%s\0' "__unknown__"
          fi | node scripts/ci-scope.mjs >> "$GITHUB_OUTPUT"

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          package-manager-cache: false
      - run: npm ci
      - run: npm run format:check

  validate:
    needs: scope
    if: ${{ needs.scope.outputs.tests == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          package-manager-cache: false
      - run: npm ci
      - run: npm run check

  package:
    needs: scope
    if: ${{ needs.scope.outputs.package == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - run: npm run package:audit

  container:
    needs: scope
    if: ${{ needs.scope.outputs.container != 'none' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - if: ${{ needs.scope.outputs.container == 'smoke' }}
        run: scripts/container-smoke.sh
      - run: docker compose config
      - run: docker compose -f compose.yaml -f compose.tailscale.yaml config

  smoke:
    name: Simulated smoke
    needs: scope
    if: ${{ needs.scope.outputs.smoke == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          package-manager-cache: false
      - run: npm ci
      - name: Verify pinned Pi
        shell: bash
        run: |
          expected=$(node -p "require('./package.json').devDependencies['@earendil-works/pi-coding-agent']")
          test "$(node_modules/.bin/pi --version)" = "$expected"
      - name: Install verified Herdr
        shell: bash
        run: |
          set -euo pipefail

          version=$(node -p \
            "require('./package.json').piHerdsman.runtime.herdr.version")
          sha=$(node -p \
            "require('./package.json').piHerdsman.runtime.herdr.sha256['linux-x86_64']")

          curl -fsSL --retry 3 --connect-timeout 10 --max-time 120 \
            "https://github.com/herdrdev/herdr/releases/download/v${version}/herdr-linux-x86_64" \
            -o "$RUNNER_TEMP/herdr"

          printf '%s  %s\n' "$sha" "$RUNNER_TEMP/herdr" |
            sha256sum -c -

          chmod 0755 "$RUNNER_TEMP/herdr"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Simulated runtime acceptance
        id: acceptance
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          set -euo pipefail

          for scenario in \
            core \
            continuation \
            chief-tree \
            supervisor-agent \
            terminal-failure \
            agent-terminal-failure \
            manager-handoff \
            agent-crash-recovery
          do
            echo "::group::Simulated smoke: $scenario"
            npm run smoke -- "$scenario" --simulated
            echo "::endgroup::"
          done
      - name: Upload sanitized failure evidence
        if: ${{ failure() && steps.acceptance.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: simulated-smoke-failure
          path: ${{ runner.temp }}/pi-herdsman-smoke-evidence-*/result.json
          if-no-files-found: warn
          retention-days: 3

  ci:
    name: CI
    if: ${{ always() }}
    needs: [scope, format, validate, package, container, smoke]
    runs-on: ubuntu-latest
    env:
      SCOPE_RESULT: ${{ needs.scope.result }}
      FORMAT_RESULT: ${{ needs.format.result }}
      VALIDATE_RESULT: ${{ needs.validate.result }}
      PACKAGE_RESULT: ${{ needs.package.result }}
      CONTAINER_RESULT: ${{ needs.container.result }}
      SMOKE_REQUIRED: ${{ needs.scope.outputs.smoke }}
      SMOKE_RESULT: ${{ needs.smoke.result }}
    steps:
      - run: |
          set -euo pipefail

          [ "$SCOPE_RESULT" = "success" ]
          [ "$FORMAT_RESULT" = "success" ]

          for result in \
            "$VALIDATE_RESULT" \
            "$PACKAGE_RESULT" \
            "$CONTAINER_RESULT"
          do
            [ "$result" = "success" ] || [ "$result" = "skipped" ]
          done

          case "$SMOKE_REQUIRED:$SMOKE_RESULT" in
            true:success|false:skipped)
              ;;
            *)
              echo "Invalid simulated smoke outcome: required=$SMOKE_REQUIRED result=$SMOKE_RESULT" >&2
              exit 1
              ;;
          esac
