name: Update vendored GitHub skills

on:
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: vendored-github-skills
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Reconcile upstream skill snapshots
        run: node scripts/update-vendored-skills.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY_PATH: ${{ runner.temp }}/skill-update-pr.md

      - name: Verify automation branch ownership
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DEPLOYMENT_AUTHORIZATION: ${{ vars.VENDORED_SKILLS_PR_ENABLED }}
        run: |
          set -euo pipefail
          # Actions expression string comparisons are case-insensitive.
          if [ "${DEPLOYMENT_AUTHORIZATION:-}" != 'true' ]; then
            echo 'Maintenance PR publication is not authorized.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          branch='automation/upstream-skills'
          bot_login='github-actions[bot]'
          pr_title='chore(deps): update vendored GitHub skills'
          repo_owner="${GITHUB_REPOSITORY%%/*}"
          branch_exists=false
          if branch_json=$(gh api "repos/${GITHUB_REPOSITORY}/branches/automation%2Fupstream-skills" 2>&1); then
            branch_exists=true
            branch_sha=$(jq -er '.commit.sha | strings | select(test("^[a-f0-9]{40}$"))' <<<"$branch_json") || {
              echo "Refusing to update $branch: GitHub returned an invalid branch head" >&2
              exit 1
            }
          elif [[ "$branch_json" != *"(HTTP 404)"* ]]; then
            echo "Unable to verify reserved branch ownership: $branch_json" >&2
            exit 1
          fi

          # Commit author metadata is user-controlled; reject conflicting PRs
          # using GitHub's PR creator and recorded head.
          prs=$(gh api --paginate --method GET "repos/${GITHUB_REPOSITORY}/pulls" \
            -f state=all \
            -f "head=${repo_owner}:${branch}" \
            -F per_page=100 | jq -s 'add // []')
          if ! jq -e \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg branch "$branch" \
            --arg bot "$bot_login" \
            --arg title "$pr_title" \
            'type == "array" and
             all(.[];
               .user.login == $bot and
               .title == $title and
               (.state == "open" or .state == "closed") and
               .head.ref == $branch and
               (.head.sha | strings | test("^[a-f0-9]{40}$")) and
               .head.repo.full_name == $repo and
               .base.ref == "main" and
               .base.repo.full_name == $repo
             ) and
             ([.[] | select(.state == "open")] | length <= 1)' <<<"$prs" >/dev/null; then
            echo "Refusing to update $branch: an unexpected PR uses the reserved branch" >&2
            exit 1
          fi

          open_pr_sha=$(jq -r '.[] | select(.state == "open") | .head.sha' <<<"$prs")
          if [[ -n "$open_pr_sha" && "$open_pr_sha" != "${branch_sha:-}" ]]; then
            echo "Refusing to update $branch: open PR head does not match the current branch head" >&2
            exit 1
          fi
          if [[ "$branch_exists" == true ]]; then
            # Writer protection, not PR history, authorizes recovery after a
            # successful branch push followed by failed PR creation.
            BRANCH_SHA="$branch_sha" node scripts/verify-vendored-skills-branch.mjs
          fi
          echo 'authorized=true' >> "$GITHUB_OUTPUT"

      - name: Create or update maintenance PR
        id: pr
        if: steps.publication.outputs.authorized == 'true'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ github.token }}
          branch: automation/upstream-skills
          base: main
          delete-branch: true
          commit-message: "chore(deps): update vendored GitHub skills"
          title: "chore(deps): update vendored GitHub skills"
          body-path: ${{ runner.temp }}/skill-update-pr.md
          author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          add-paths: |
            vendor/github-cli/
            vendor/gh-stack/

      - name: Report maintenance PR operation
        if: always() && steps.pr.outcome == 'success'
        env:
          OPERATION: ${{ steps.pr.outputs.pull-request-operation }}
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
        run: |
          {
            echo '### Maintenance PR action'
            echo
            echo "- Operation: ${OPERATION:-none}"
            if [[ -n "${PR_URL:-}" ]]; then echo "- PR: ${PR_URL}"; fi
          } >> "$GITHUB_STEP_SUMMARY"
