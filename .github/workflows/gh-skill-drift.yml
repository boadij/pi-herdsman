name: Review upstream gh skill drift

on:
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Compare vendored reference to upstream trunk
        run: node scripts/gh-skill-drift.mjs
        env:
          GH_TOKEN: ${{ github.token }}
