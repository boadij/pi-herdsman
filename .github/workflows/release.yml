name: Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Release action to perform
        required: true
        type: choice
        options:
          - prepare
          - publish

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && inputs.mode == 'prepare'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

  publish:
    if: github.ref == 'refs/heads/main' && inputs.mode == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

      - name: Check out the release commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch origin main --tags
          git checkout --detach origin/main
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          test -n "$VERSION"
          git rev-parse "$TAG^{commit}"
          test "$(git rev-parse "$TAG^{commit}")" = "$(git rev-parse HEAD)"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Skip an already published version
        run: |
          set -euo pipefail
          if npm view "pi-herdsman@$VERSION" version >/dev/null 2>&1; then
            echo "pi-herdsman@$VERSION is already published"
            echo "ALREADY_PUBLISHED=true" >> "$GITHUB_ENV"
          else
            echo "ALREADY_PUBLISHED=false" >> "$GITHUB_ENV"
          fi

      - name: Validate the exact release
        if: env.ALREADY_PUBLISHED != 'true'
        run: |
          set -euo pipefail
          npm ci
          npm run check
          npm run build
          npm run package:audit
          npm pack --dry-run

      - name: Publish to npm with provenance
        if: env.ALREADY_PUBLISHED != 'true'
        run: npm publish --access public --provenance
