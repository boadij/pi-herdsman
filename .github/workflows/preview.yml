name: Publish PR Preview

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Open same-repository PR number
        required: true
        type: string
  pull_request_target:
    types: [closed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: npm-preview-pr-${{ inputs.pr || github.event.pull_request.number }}
  cancel-in-progress: false
  queue: max

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.target.outputs.sha }}

    steps:
      - id: target
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
        run: |
          set -euo pipefail

          [[ "$PR" =~ ^[1-9][0-9]*$ ]] || {
            echo "PR must be a positive canonical integer" >&2
            exit 1
          }

          IFS=$'\t' read -r STATE HEAD_REPO HEAD_SHA < <(
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" \
              --jq '[.state, .head.repo.full_name, .head.sha] | @tsv'
          )

          [ "$STATE" = "open" ]
          [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]

          echo "sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ steps.target.outputs.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: npm ci

      - id: package
        env:
          PR: ${{ inputs.pr }}
          HEAD_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail

          VERSION="0.0.0-pr.$PR.g${HEAD_SHA:0:12}"

          test "$(node -p "require('./package.json').name")" = "pi-herdsman"

          npm --no-git-tag-version version "$VERSION"
          npm pkg set previewSourceSha="$HEAD_SHA"
          npm run release:check -- --tag "pr-$PR"

          test "$(node -p "require('./package.json').name")" = "pi-herdsman"
          test "$(node -p "require('./package.json').version")" = "$VERSION"

          mkdir -p "$RUNNER_TEMP/npm-preview"
          npm pack \
            --ignore-scripts \
            --pack-destination "$RUNNER_TEMP/npm-preview" \
            >/dev/null

      - uses: actions/upload-artifact@v7
        with:
          name: npm-preview
          path: ${{ runner.temp }}/npm-preview/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    if: github.event_name == 'workflow_dispatch'
    needs: prepare
    runs-on: ubuntu-latest
    environment: npm-preview

    permissions:
      contents: read
      pull-requests: read
      id-token: write

    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - uses: actions/download-artifact@v8
        with:
          name: npm-preview
          path: package

      - name: Publish preview
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: pi-herdsman
          PR: ${{ inputs.pr }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          VERSION="0.0.0-pr.$PR.g${SHA:0:12}"
          TAG="pr-$PR"
          REGISTRY="https://registry.npmjs.org"

          TARBALLS=(./package/*.tgz)
          [ "${#TARBALLS[@]}" -eq 1 ]

          mkdir manifest
          tar -xzf "${TARBALLS[0]}" -C manifest package/package.json
          test "$(node -p "require('./manifest/package/package.json').name")" = "$PACKAGE"
          test "$(node -p "require('./manifest/package/package.json').version")" = "$VERSION"
          test "$(node -p "require('./manifest/package/package.json').previewSourceSha")" = "$SHA"

          npm install -g npm@11.21.0

          IFS=$'\t' read -r STATE HEAD_REPO CURRENT_SHA < <(
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" \
              --jq '[.state, .head.repo.full_name, .head.sha] | @tsv'
          )
          [ "$STATE" = "open" ]
          [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ]
          [ "$CURRENT_SHA" = "$SHA" ]

          VERSIONS=$(npm view "$PACKAGE" versions --json --registry "$REGISTRY")
          jq -e 'type == "array" or type == "string"' <<<"$VERSIONS" >/dev/null
          if jq -e --arg v "$VERSION" \
            'if type == "array" then index($v) != null else . == $v end' \
            <<<"$VERSIONS" >/dev/null; then
            PUBLISHED_SHA=$(npm view "$PACKAGE@$VERSION" previewSourceSha \
              --registry "$REGISTRY")
            [ "$PUBLISHED_SHA" = "$SHA" ] || {
              echo "Published version does not identify source commit $SHA" >&2
              exit 1
            }
            npm dist-tag add "$PACKAGE@$VERSION" "$TAG" \
              --registry "$REGISTRY"
            echo "$PACKAGE@$VERSION is already published; reconciled $TAG"
          else
            npm publish "${TARBALLS[0]}" \
              --registry "$REGISTRY" \
              --tag "$TAG" \
              --ignore-scripts
          fi

          {
            echo "### npm PR preview"
            echo
            echo "- PR: #$PR"
            echo "- Commit: \`$SHA\`"
            echo "- Version: \`$VERSION\`"
            echo "- Tag: \`$TAG\`"
            echo
            echo "\`pi install npm:$PACKAGE@$TAG\`"
            echo
            echo "Exact build:"
            echo
            echo "\`pi install npm:$PACKAGE@$VERSION\`"
          } >> "$GITHUB_STEP_SUMMARY"

  cleanup:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: npm-preview
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: npm install -g npm@11.21.0

      - name: Remove closed PR preview tag
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          PACKAGE: pi-herdsman
        run: |
          set -euo pipefail

          TAG="pr-$PR"
          REGISTRY="https://registry.npmjs.org"

          STATE=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '.state')
          case "$STATE" in
            closed) ;;
            open) echo "PR #$PR is open; skipping cleanup"; exit 0 ;;
            *) echo "Unexpected PR state: $STATE" >&2; exit 1 ;;
          esac

          TAGS=$(npm view "$PACKAGE" dist-tags --json --registry "$REGISTRY")
          jq -e 'type == "object"' <<<"$TAGS" >/dev/null
          EXISTING=$(jq -r --arg tag "$TAG" '.[$tag] // empty' <<<"$TAGS")

          if [ -n "$EXISTING" ]; then
            case "$EXISTING" in
              "0.0.0-pr.$PR."*) ;;
              *) echo "Unexpected version associated with PR tag" >&2; exit 1 ;;
            esac
            npm dist-tag rm "$PACKAGE" "$TAG" --registry "$REGISTRY"
          else
            echo "$TAG is already absent; nothing to remove"
          fi
