name: Peer federation

on:
  push:
    branches: [feat/federated-manager-peers, main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  peer-federation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          package-manager-cache: false
      - name: Verify checkout SHA
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - run: npm ci
      - run: node scripts/peer-federation-smoke.mjs
