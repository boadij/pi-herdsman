name: Temporary release PR formatter

on:
  push:
    branches: [fix/release-ship-deterministic-executor]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - run: npm install --global prettier@3.10.1 --ignore-scripts --no-audit --no-fund
      - run: prettier --write .pi/prompts/release.md scripts/release-ship.mjs scripts/release-ship.test.mjs
      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .pi/prompts/release.md scripts/release-ship.mjs scripts/release-ship.test.mjs
            git commit -m 'style(release): apply repository formatter'
            git push origin HEAD:fix/release-ship-deterministic-executor
          fi
