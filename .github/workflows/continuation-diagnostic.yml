name: Temporary continuation A/B diagnostic

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: continuation-diagnostic-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  continuation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Select isolated comparison target
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git checkout --detach "$SOURCE_SHA"
          printf 'comparison_target=pr-head\n' >> "$GITHUB_STEP_SUMMARY"
          printf 'checkout=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - run: npm ci
      - name: Verify exact Pi and Node baselines
        shell: bash
        run: |
          set -euo pipefail
          expected=$(node -p "require('./package.json').devDependencies['@earendil-works/pi-coding-agent']")
          test "$(node_modules/.bin/pi --version)" = "$expected"
          node -e 'const p=require("./package.json"); const v=p.piHerdsman.runtime.pi; if(v!==p.devDependencies["@earendil-works/pi-coding-agent"]) process.exit(1)'
          npm ls --depth=0 @earendil-works/pi-ai @earendil-works/pi-coding-agent @earendil-works/pi-tui
      - name: Install verified Herdr
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').piHerdsman.runtime.herdr.version")
          sha=$(node -p "require('./package.json').piHerdsman.runtime.herdr.sha256['linux-x86_64']")
          curl -fsSL --retry 3 --connect-timeout 10 --max-time 120 \
            "https://github.com/herdrdev/herdr/releases/download/v${version}/herdr-linux-x86_64" \
            -o "$RUNNER_TEMP/herdr"
          printf '%s  %s\n' "$sha" "$RUNNER_TEMP/herdr" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/herdr"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Run selected continuation acceptance
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
        run: npm run smoke -- continuation --simulated
      - name: Upload sanitized failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: continuation-diagnostic-${{ matrix.target }}
          path: ${{ runner.temp }}/pi-herdsman-smoke-evidence-*/result.json
          if-no-files-found: warn
          retention-days: 3
