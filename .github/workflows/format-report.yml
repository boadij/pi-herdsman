name: Temporary formatting diagnostic

on:
  push:
    branches: [feat/agent-specialization-audit]

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          package-manager-cache: false
      - run: npm ci
      - run: npm run format
      - run: git diff -- scripts/package-audit.mjs skills/agent-specialization-audit/SKILL.md
